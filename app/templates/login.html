{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2>Вход</h2>
    <p style="color: var(--text-secondary); margin-bottom: 16px;">
        Введите логин и пароль от аккаунта
    </p>

    <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="login" name="login" placeholder="Логин" required>
        <input type="password" id="password" name="password" placeholder="Пароль" required>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="remember" name="remember" checked>
            Запомнить сессию
        </label>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <div id="login-status" style="margin-top: 12px;"></div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const status = document.getElementById("login-status");

    status.innerHTML = '<span style="color: var(--text-secondary);">Вход...</span>';

    const formData = new FormData(form);
    const data = {
        login: formData.get("login"),
        password: formData.get("password"),
        remember: formData.get("remember") === "on",
    };

    try {
        const resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
        });
        const result = await resp.json();

        if (result.ok) {
            status.innerHTML = '<span style="color: var(--success);">Успешный вход!</span>';
            setTimeout(() => { window.location.href = "/"; }, 1000);
        } else {
            status.innerHTML = `<span style="color: var(--error);">${result.error || "Ошибка входа"}</span>`;
        }
    } catch (err) {
        status.innerHTML = `<span style="color: var(--error);">Ошибка соединения</span>`;
    }
});
</script>
{% endblock %}
